name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖库
      run: |
        pip install pyinstaller pandas openpyxl python-docx

    - name: 打包成 EXE
      run: pyinstaller --onefile --console script.py

    - name: 上传打包好的 EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/script.exe
